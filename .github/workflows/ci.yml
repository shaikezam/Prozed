name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run Maven clean install
      run: mvn clean install -B -V
      
    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
          
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests (Java ${{ matrix.java-version }})
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit

    - name: Check PMD Report Existence
      id: check_pmd
      if: always()
      # This checks if at least one pmd.xml exists and has content
      run: |
        FILES=$(find . -name "pmd.xml" -path "*/target/*" -size +10c)
        if [ -z "$FILES" ]; then
          echo "exists=false" >> $GITHUB_OUTPUT
        else
          echo "exists=true" >> $GITHUB_OUTPUT
        fi

    - name: PMD Quality Report
      # Only run if the previous step found a valid file
      if: always() && steps.check_pmd.outputs.exists == 'true'
      uses: dorny/test-reporter@v1
      with:
          name: PMD Violations (Java ${{ matrix.java-version }})
          path: '**/target/pmd.xml'
          reporter: java-junit
