name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run Maven clean install
      run: mvn clean install -B -V
      
    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
          
    - name: Generate CTRF Report
      if: ${{ !cancelled() }}
      run: |
        # Install github-actions-ctrf
        npm install -g github-actions-ctrf
        
        # Convert Maven Surefire XML to CTRF JSON
        npx ctf-report '**/target/surefire-reports/TEST-*.xml' --output ctrf-report.json --format junit
        
    - name: Publish Test Summary Results
      run: npx github-actions-ctrf ctrf/ctrf-report.json
