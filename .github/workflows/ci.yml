name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run Maven clean install
      run: mvn clean install -B -V
      
    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
          
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests (Java ${{ matrix.java-version }})
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit

    - name: Generate PMD Summary
      if: always()
      run: |
        echo "### 🔍 PMD Analysis Results" >> $GITHUB_STEP_SUMMARY
        
        # Find all pmd.xml files in any submodule
        REPORT_FILES=$(find . -name "pmd.xml" -path "*/target/*")
        
        if [ -z "$REPORT_FILES" ]; then
          echo "⚠️ No PMD reports found. Check if the pmd-plugin is running in your Maven build." >> $GITHUB_STEP_SUMMARY
        else
          TOTAL_VIOLATIONS=0
        
          # Loop through found reports and count violations
          for file in $REPORT_FILES; do
            COUNT=$(grep -c "<violation" "$file" || echo "0")
            TOTAL_VIOLATIONS=$((TOTAL_VIOLATIONS + COUNT))
        
            if [ "$COUNT" -gt "0" ]; then
              MODULE_NAME=$(echo "$file" | cut -d'/' -f2)
              echo "* **$MODULE_NAME**: $COUNT violations" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$TOTAL_VIOLATIONS" -gt "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Total Violations: $TOTAL_VIOLATIONS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No PMD violations found in any module!" >> $GITHUB_STEP_SUMMARY
          fi
        fi
