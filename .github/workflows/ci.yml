name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [17]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Run Maven clean install
      run: mvn clean install -B -V
      
    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-java-${{ matrix.java-version }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
          
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests (Java ${{ matrix.java-version }})
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit

    - name: Upload PMD HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pmd-report
        path: '**/target/reports/pmd.html'

    - name: Post Summary to PR
      if: always()
      run: |
        echo "### 🎨 PMD HTML Report Generated" >> $GITHUB_STEP_SUMMARY
        echo "The full visual report is available in the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          
        # Simple check to see if violations exist to alert the user
        if grep -q "violation" **/target/pmd.xml 2>/dev/null; then
          echo "❌ **Violations detected!** Please download the HTML artifact to see details." >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **Code looks clean!**" >> $GITHUB_STEP_SUMMARY
        fi
