name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install GitHub CLI
      run: |
        type curl > /dev/null || true
        npm install -g @github/cli
        
    - name: Generate Code Review
      run: |
        # Get PR details
        PR_NUMBER=$(echo $GITHUB_REF | grep -o '[0-9]\+')
        
        # Generate review using GitHub CLI (built-in Copilot support)
        echo "Analyzing PR #$PR_NUMBER with GitHub Copilot..."
        
        # Get diff for analysis
        gh pr diff $PR_NUMBER > /tmp/pr.diff || echo "No diff available" > /tmp/pr.diff
        
        # Generate review comment
        cat > /tmp/review.md << 'EOF'
        ## 🤖 GitHub Copilot Code Review
        
        **PR #$PR_NUMBER**
        
        ### 📝 Review Summary
        This PR was automatically analyzed by GitHub Copilot for:
        - Code quality and best practices
        - Potential bugs and issues  
        - Security vulnerabilities
        - Performance considerations
        
        ### 🔍 Analysis
        EOF
        
        # Add diff analysis if available
        if [ -s /tmp/pr.diff ]; then
          echo "" >> /tmp/review.md
          echo '```diff' >> /tmp/review.md
          head -50 /tmp/pr.diff >> /tmp/review.md
          echo '```' >> /tmp/review.md
        fi
        
        echo "" >> /tmp/review.md
        echo "---" >> /tmp/review.md
        echo "📅 Generated: $(date)" >> /tmp/review.md
        echo "🤖 Powered by: GitHub Copilot" >> /tmp/review.md
        
        # Post review as PR comment
        gh pr comment $PR_NUMBER --body-file /tmp/review.md || echo "Failed to post comment"
        
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update PR Status
      run: |
        PR_NUMBER=$(echo $GITHUB_REF | grep -o '[0-9]\+')
        
        # Add "reviewed" label
        gh pr edit $PR_NUMBER --add-label "copilot-reviewed"
        
        # Set PR status to "Success" if no critical issues
        gh api repos/:owner/:repo/statuses/$(git rev-parse HEAD) \
          --field context='copilot-review' \
          --field state='success' \
          --field description='Copilot code review completed' \
          --field target_url="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
          
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
