name: Publish Maven Multi-Module Package

on:
  release:
    types: [ published ] # Fires only when you click "Publish Release" in the UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants write access to GitHub Packages

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Publish to GitHub Packages
        run: mvn --batch-mode clean deploy -P release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}