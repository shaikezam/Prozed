name: Test Report

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: test-results-java-17
        path: test-results
        
    - name: Test Report
      uses: dorny/test-reporter@v2
      with:
        artifact: test-results-java-17
        name: Maven Tests (Java 17)
        path: '**/*.xml'
        reporter: java-junit
        fail-on-error: true
        use-actions-summary: true
        report-title: 'Test Results'
        badge-title: 'tests'
