web.service.port=${SERVICE_PORT:8080}
web.service.scan-package=com.example.activity
db.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/activity_db
db.driver-class-name=org.mariadb.jdbc.Driver
db.username=${DB_USER:root}
db.password=${DB_PASSWORD}
flyway.enabled=true
jms.broker.type=activemq
jms.broker.url=tcp://${MQ_HOST}:${MQ_PORT:61616}
jms.username=${MQ_USER:admin}
jms.password=${MQ_PASSWORD:admin}
jms.client-id=activity-service
